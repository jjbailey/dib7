---
# playbooks/import-ova-vsphere.yml
# vim: set tabstop=2 shiftwidth=2 expandtab:

# Playbook to import an OVA file to a vSphere content library.
# This creates the vSphere OVA branch in the workflow.
# VMDK must be streamOptimized.

- name: Import OVA to vSphere
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false
  serial: 2

  # See the comment in build-qcow2.yml for why this uses block/rescue instead of
  # max_fail_percentage to survive a per-host failure.
  pre_tasks:
    # Outside the rescue below: missing pwsh or a missing helper script is an
    # environment problem, not a per-image one.
    - name: Verify pwsh is available on localhost
      ansible.builtin.command:
        cmd: pwsh --version
      delegate_to: localhost
      register: pwsh_check
      failed_when: pwsh_check.rc != 0
      changed_when: false

    - name: Verify vSphere import helper exists on localhost
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../bin/import-ova-vsphere.ps1"
      delegate_to: localhost
      register: import_helper_stat

    - name: Fail if vSphere import helper is missing
      ansible.builtin.fail:
        msg: "vSphere import helper {{ playbook_dir }}/../bin/import-ova-vsphere.ps1 is missing"
      when: not import_helper_stat.stat.exists or not import_helper_stat.stat.isreg

  tasks:
    - name: Include common setup tasks
      ansible.builtin.include_tasks: common-setup.yml

    # Resolve the vCenter credentials from the multi-vCenter vault; the
    # selector honors -e vsphere_target_vcenter and the legacy flat vault.
    - name: Resolve the vCenter credentials from the vault
      ansible.builtin.include_tasks: tasks/select-vcenter.yml

    - name: Import the OVA
      block:
        # The gate that stops an OVA left over from an earlier run reaching the
        # content library. Without it a host whose build or conversion never ran
        # this time still has last run's .ova sitting in build_dir, and it gets
        # published as though it were fresh.
        - name: Require an OVA converted by this run
          ansible.builtin.include_tasks: verify-stamp.yml
          vars:
            stamp_file: "{{ convert_stamp_file }}"
            stamp_producer: convert-qcow2-to-ova

        - name: Verify source OVA file exists
          ansible.builtin.stat:
            path: "{{ build_dir }}/{{ ova_file }}"
          delegate_to: localhost
          register: ova_stat

        - name: Fail if source OVA file is missing or empty on localhost
          ansible.builtin.fail:
            msg: "Source OVA file {{ build_dir }}/{{ ova_file }} is missing or empty on localhost"
          when: not ova_stat.stat.exists or not ova_stat.stat.isreg or (ova_stat.stat.size | default(0) | int) == 0

        - name: Initiate import process
          ansible.builtin.command:
            argv:
              - pwsh
              - "{{ playbook_dir }}/../bin/import-ova-vsphere.ps1"
              - "-library"
              - "{{ vsphere_content_library }}"
              - "-ova"
              - "{{ build_dir }}/{{ ova_file }}"
          delegate_to: localhost
          register: import_result
          changed_when: import_result.rc == 0
          no_log: true
          environment:
            vcenter_hostname: "{{ vcenter_hostname }}"
            vcenter_username: "{{ vcenter_username }}"
            vcenter_password: "{{ vcenter_password }}"

        # Coexists with the content_library_template entry published by
        # import-ova-vsphere-template.yml: artifact_type is part of the catalog
        # dedup key, so both survive. Consumers filter on it.
        - name: Publish vSphere OVA to image catalog
          ansible.builtin.include_tasks: publish-image-catalog.yml
          vars:
            catalog_provider: vsphere
            catalog_artifact_id: "{{ ova_file }}"
            catalog_artifact_type: content_library_ova
            catalog_supersede: true
            catalog_boot_mode: "{{ image_boot_mode }}"
            catalog_scope:
              content_library: "{{ vsphere_content_library }}"
              vcenter: "{{ vsphere_target_name }}"

        # Last task in the block, so a host only counts as succeeded if the
        # import and the catalog publish both worked.
        - name: Mark the import successful
          ansible.builtin.set_fact:
            stage_succeeded: true

      rescue:
        # stage_error is the only place this detail is assembled now: it takes
        # the failing task's stderr/stdout/rc, which for these pwsh tasks is
        # where the PowerCLI error text lives. no_log stays on because the tasks
        # around it handle the vCenter credentials; the summary play reports
        # stage_error, and that is not censored.
        - name: Record that the import failed
          ansible.builtin.set_fact:
            stage_error: >-
              {{ ansible_failed_task.name | default('unknown task') }}:
              {{ (ansible_failed_result.stderr | default('', true))
                 or (ansible_failed_result.stdout | default('', true))
                 or (ansible_failed_result.msg | default('', true))
                 or 'unknown error' }}
              {{ ('rc=' ~ ansible_failed_result.rc) if ansible_failed_result.rc is defined else '' }}
          no_log: true

        - name: Report the import failure
          ansible.builtin.debug:
            msg: >-
              IMPORT FAILED for {{ inventory_hostname }} at task
              '{{ ansible_failed_task.name }}'.
              {{ stage_error }}
          no_log: true

      always:
        - name: Display import result
          ansible.builtin.debug:
            msg: "OVA import exited with return code {{ import_result.get('rc', 'unknown') }}"
          when: import_result is defined

- name: Report import results
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false
  ignore_unreachable: true

  tasks:
    - name: Fail if any OVA failed to import
      ansible.builtin.include_tasks: tasks/fail-if-stage-failed.yml
      vars:
        stage_name: import-ova-vsphere

