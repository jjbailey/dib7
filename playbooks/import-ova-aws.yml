---
# playbooks/import-ova-aws.yml
# vim: set tabstop=2 shiftwidth=2 expandtab:

# Import OVA file to AWS AMI using EC2 Import Image service.
# VMDK must be streamOptimized.

- name: Import OVA to AWS AMI
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false
  serial: 1

  tasks:
    - name: Include common setup tasks
      ansible.builtin.include_tasks: common-setup.yml

    - name: Include AWS vault variables
      ansible.builtin.include_vars:
        file: "../vaults/aws.yml"

    - name: Import OVA to AMI
      block:
        - name: Require an OVA converted by this run
          ansible.builtin.include_tasks: verify-stamp.yml
          vars:
            stamp_file: "{{ convert_stamp_file }}"
            stamp_producer: convert-qcow2-to-ova

        - name: Verify OVA file exists
          ansible.builtin.stat:
            path: "{{ build_dir }}/{{ ova_file }}"
          register: ova_stat

        - name: Fail if OVA file is missing or empty
          ansible.builtin.fail:
            msg: "Source OVA file {{ build_dir }}/{{ ova_file }} is missing or empty"
          when: not ova_stat.stat.exists or not ova_stat.stat.isreg or (ova_stat.stat.size | default(0) | int) == 0

        - name: Upload OVA to S3
          amazon.aws.s3_object:
            bucket: "{{ s3_bucket }}"
            object: "{{ ova_file }}"
            src: "{{ build_dir }}/{{ ova_file }}"
            mode: put
            region: "{{ aws_region }}"
          environment:
            AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          register: s3_upload

        - name: Confirm OVA upload to S3
          ansible.builtin.debug:
            msg: "OVA uploaded to s3://{{ s3_bucket }}/{{ ova_file }}"

        - name: Initiate import process
          amazon.aws.ec2_import_image:
            region: "{{ aws_region }}"
            task_name: "{{ inventory_hostname }}-import-{{ now(fmt='%s') }}"
            description: "Import of {{ ova_file }}"
            disk_containers:
              - description: "OVA disk container"
                format: OVA
                user_bucket:
                  s3_bucket: "{{ s3_bucket }}"
                  s3_key: "{{ ova_file }}"
            role_name: "{{ vmimport_role_name }}"
            boot_mode: "{{ aws_import_boot_mode | default('uefi') }}"
            state: present
          register: import_task

        - name: Display import task ID
          ansible.builtin.debug:
            msg: "Import task started: {{ import_task.import_image.import_task_id }}"

        - name: Wait for import to complete
          amazon.aws.ec2_import_image_info:
            region: "{{ aws_region }}"
            import_task_ids:
              - "{{ import_task.import_image.import_task_id }}"
          register: import_status
          until: >-
            (import_status.import_image | default([]) | length > 0) and
            (((import_status.import_image | first).status | default('')) in
              ['completed', 'deleted', 'failed'])
          failed_when: >-
            (import_status.import_image | default([]) | length > 0) and
            (((import_status.import_image | first).status | default('')) in ['deleted', 'failed'])
          retries: "{{ aws_import_poll_retries | default(180) | int }}"
          delay: "{{ aws_import_poll_delay | default(60) | int }}"

        - name: Record new AMI ID
          ansible.builtin.set_fact:
            new_ami_id: "{{ (import_status.import_image | first).image_id }}"

        - name: Display new AMI ID
          ansible.builtin.debug:
            msg: "Import complete! AMI ID: {{ new_ami_id }}"

        - name: Verify AMI creation
          amazon.aws.ec2_ami_info:
            region: "{{ aws_region }}"
            filters:
              image-id: ["{{ new_ami_id }}"]
          register: ami_info
          failed_when: ami_info.images | length == 0

        - name: Tag imported AMI
          amazon.aws.ec2_tag:
            region: "{{ aws_region }}"
            resource: "{{ new_ami_id }}"
            tags:
              Name: "{{ image_name }}"
            state: present

        - name: Publish imported AMI to image catalog
          ansible.builtin.include_tasks: publish-image-catalog.yml
          vars:
            catalog_provider: aws
            catalog_artifact_id: "{{ new_ami_id }}"
            catalog_artifact_type: ami
            catalog_region: "{{ aws_region }}"
            catalog_boot_mode: "{{ image_boot_mode }}"

        - name: Remove OVA from S3 after successful import
          amazon.aws.s3_object:
            bucket: "{{ s3_bucket }}"
            object: "{{ ova_file }}"
            mode: delobj
            region: "{{ aws_region }}"

        # Last task in the block, so a host only counts as succeeded if the
        # import and the catalog publish both worked.
        - name: Mark the import successful
          ansible.builtin.set_fact:
            stage_succeeded: true

      rescue:
        - name: Clean up S3 on failure
          amazon.aws.s3_object:
            bucket: "{{ s3_bucket }}"
            object: "{{ ova_file }}"
            mode: delobj
            region: "{{ aws_region }}"
          when: s3_upload is defined
          register: s3_cleanup
          failed_when: false

        - name: Record that the import failed
          ansible.builtin.set_fact:
            stage_failed: true
            stage_error: >-
              {{ ansible_failed_task.name }}:
              {{ ansible_failed_result.msg | default('no message') | trim }}

        - name: Report the import failure
          ansible.builtin.debug:
            msg: >-
              IMPORT FAILED for {{ inventory_hostname }} at task
              '{{ ansible_failed_task.name }}'.
              {{ ansible_failed_result.msg | default('') | trim }}
              S3 cleanup attempted.

      always:
        - name: Display import result
          ansible.builtin.debug:
            msg: "AMI import task {{ import_task.import_image.import_task_id }} ended with new_ami_id={{ new_ami_id | default('none') }}"
          when: import_task is defined

- name: Report import results
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: false
  ignore_unreachable: true

  tasks:
    - name: Fail if any AMI failed to import
      ansible.builtin.fail:
        msg: |-
          import-ova-aws failed for {{ import_failures | length }} of
          {{ ansible_play_hosts_all | length }} hosts:
          {% for host in import_failures %}
            {{ host }}: {{ hostvars[host].stage_error | default('see log') | trim }}
          {% endfor %}
      # Pinned to one host rather than run_once - see build-qcow2.yml.
      when:
        - inventory_hostname == ansible_play_hosts_all[0]
        - import_failures | length > 0
      vars:
        # Fail-closed, matching build-qcow2.yml: anything that did not reach
        # the success marker counts as a failure. Keying off stage_failed
        # instead would let a host that never ran the rescue - an unreachable
        # host, for one - pass as though it had imported.
        import_failures: >-
          {{ ansible_play_hosts_all
             | map('extract', hostvars)
             | rejectattr('stage_succeeded', 'defined')
             | map(attribute='inventory_hostname')
             | list }}
