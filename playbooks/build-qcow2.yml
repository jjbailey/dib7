---
# playbooks/build-qcow2.yml
# vim: set tabstop=2 shiftwidth=2 expandtab:

# Playbook to create a QCOW2 file from a cloud image.

- name: Build QCOW2 disk image
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: true
  serial: 1
  max_fail_percentage: 100

  tasks:
    - name: Include common setup tasks
      ansible.builtin.include_tasks: common-setup.yml

    - name: Clean up old loop devices and mounts
      ansible.builtin.shell: |
        set -euo pipefail
        dib_tmp="${TMP_DIR:-/tmp}/dib_"
        mount_points="$(mount | awk -v root="{{ build_dir }}" -v tmp="$dib_tmp" '
          { mp = $3 }
          index(mp, root) == 1 && (length(mp) == length(root) || substr(mp, length(root) + 1, 1) == "/") { print length(mp), mp; next }
          index(mp, tmp) == 1 { print length(mp), mp }
        ' | sort -rn | cut -d" " -f2-)"
        while IFS= read -r mount_point; do
          [ -z "$mount_point" ] || umount -l "$mount_point"
        done <<< "$mount_points"

        # Remove the now-unmounted scratch dirs so /tmp does not fill up.
        find "${TMP_DIR:-/tmp}" -maxdepth 1 -type d \
          \( -name 'dib_build.*' -o -name 'dib_image.*' \) -exec rm -rf {} + || true

        # Detach loop devices backed by a file under build_dir or a dib
        # scratch dir.
        loop_devices="$(losetup -a | awk -v root="{{ build_dir }}" -v tmp="$dib_tmp" '
          index($0, root) > 0 || index($0, tmp) > 0 { sub(/:.*/, "", $1); print $1 }
        ')"
        while IFS= read -r loop_dev; do
          [ -z "$loop_dev" ] || losetup -d "$loop_dev"
        done <<< "$loop_devices"
      args:
        executable: /bin/bash
      become: true
      changed_when: false

    - name: Remove old build artifacts
      ansible.builtin.file:
        path: "{{ build_dir }}/{{ item }}"
        state: absent
      loop:
        - "{{ image_name }}.{{ image_type }}"
        - "{{ image_name }}.log"

    - name: Execute disk-image-create to build image
      ansible.builtin.command:
        cmd: >-
          {{ venv_bin }}/disk-image-create
          -a {{ image_arch }}
          -t {{ image_type }}
          -o {{ build_dir }}/{{ image_name }}.{{ image_type }}
          --image-size {{ image_size }}
          -x -x
          --logfile {{ build_dir }}/{{ image_name }}.log
          {{ elements_base }} {{ elements_custom }}
      environment:
        PATH: "{{ path }}"
        ELEMENTS_PATH: "{{ elements_path }}"
        DIB_RELEASE: "{{ dib_release }}"
        DIB_BLOCK_DEVICE: "{{ dib_block_device }}"
        DIB_BLOCK_DEVICE_CONFIG: "{{ dib_block_device_config }}"
        DIB_OPENSSH_SERVER_HARDENING: "{{ dib_openssh_server_hardening }}"
        DIB_CLOUD_INIT_DATASOURCES: "{{ dib_cloud_init_datasources }}"
        DIB_BOOTLOADER_DEFAULT_CMDLINE: "{{ dib_bootloader_default_cmdline }}"
        DPKG_OPTS: "{{ dpkg_opts }}"
        DEBIAN_FRONTEND: "{{ debian_frontend }}"
        NEEDRESTART_MODE: "{{ needrestart_mode }}"
      changed_when: true
      # failed_when is required for the guard task below to run at all: without
      # it a non-zero rc aborts the play here, and the build log path is never
      # reported. Do not add no_log - it censors the stderr the guard reports.
      failed_when: false
      register: disk_image_create_result

    - name: Fail if disk-image-create failed
      ansible.builtin.fail:
        msg: >-
          disk-image-create failed with rc={{ disk_image_create_result.rc }}.
          Full build log: {{ build_dir }}/{{ image_name }}.log
          stderr: {{ disk_image_create_result.stderr | default('') | trim }}
      when: disk_image_create_result.rc != 0

    - name: Configure swap space in image
      when: add_swap | default(false) | bool
      block:
        - name: Create temporary swap configuration script
          ansible.builtin.tempfile:
            state: file
            suffix: .sh
          register: swap_script

        - name: Generate swap setup script content
          ansible.builtin.copy:
            dest: "{{ swap_script.path }}"
            content: |
              lvcreate lv_swap vg1 {{ swap_size }}
              mkswap {{ swap_device }}
              write-append /etc/fstab "{{ swap_device }} none swap sw 0 0\n"
            mode: "0644"

        - name: Apply swap configuration to the image using guestfish
          ansible.builtin.command:
            cmd: >-
              guestfish --rw --network -i -a {{ build_dir }}/{{ image_name }}.{{ image_type }} -f {{ swap_script.path }}
          become: true
          changed_when: true
          register: guestfish_result
          failed_when: guestfish_result.rc != 0

      always:
        - name: Clean up temporary swap script
          ansible.builtin.file:
            path: "{{ swap_script.path }}"
            state: absent
          when: swap_script is defined

    - name: Retrieve image metadata
      ansible.builtin.command:
        cmd: "qemu-img info {{ build_dir }}/{{ image_name }}.{{ image_type }}"
      register: qemu_info
      changed_when: false
      failed_when: qemu_info.rc != 0

    - name: Display image information
      ansible.builtin.debug:
        msg: "{{ qemu_info.stdout_lines }}"

