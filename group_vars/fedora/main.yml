---
# group_vars/fedora/main.yml
# vim: set tabstop=2 shiftwidth=2 expandtab:

# first include group_vars/all/main.yml

dib_block_device: "gpt"
dib_block_device_config: "{{ lookup('ansible.builtin.file', '../block-device-config/block-device-efi-config.yml') }}"
dib_openssh_server_hardening: "0"
dib_cloud_init_datasources: "None"
dib_bootloader_default_cmdline: "biosdevname=0 iommu=on ipv6.disable=1 net.ifnames=0 dm_mod.use_blk_mq=Y scsi_mod.use_blk_mq=Y"

elements_base: "bootloader block-device-efi-lvm fedora dracut-regenerate"
elements_path: "../elements"
elements_custom: "custom-{{ target_group }}"

vm_memory_mb: "4096"
vm_cpus: "4"

# Fake the guest ID as centos9_64Guest. Fedora's real IDs (fedora64Guest /
# fedoraGuest) are NOT on VMware's guest-customization matrix, so a template
# deploy that runs guest customization fails with: guest OS "Red Hat Fedora
# (64-bit)" ... is not supported for customization. Confirmed 2026-07-22 with
# fedora64Guest. centos9_64Guest IS supported and is the closest RHEL-family
# match, so the clone can be customized. The honest OS name is kept in
# vm_os_description below. Do not switch this back to a fedora* ID.
vm_os_type: "centos9_64Guest"

add_swap: true
swap_device: "/dev/mapper/vg1-lv_swap"
swap_size: "4096"

# vmware
vm_network: "VM Network"
vm_os_description: "Red Hat Fedora (64-bit)"
vsphere_content_library: "Content_Library"

