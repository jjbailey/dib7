---
# group_vars/debian/main.yml
# vim: set tabstop=2 shiftwidth=2 expandtab:

# first include group_vars/all/main.yml

# Only what differs per distro lives here. The block device, bootloader,
# element path, VM sizing and swap settings are shared and live in
# group_vars/all/main.yml; see doc/group-vars-distro.md.
elements_base: "bootloader block-device-efi-lvm debian-minimal"

# VMware does not expose a Debian Trixie (13) guest ID even at vmx-21, so use
# the closest supported identifier. debian12_64Guest requires hardware version
# vmx-20 or newer (see the vmx-20 pin in templates/ovf-file.j2).
vm_os_type: "debian12_64Guest"

# Match the compatibility guest ID above for VMware import metadata.
vm_os_description: "Debian GNU/Linux 12 (64-bit)"

