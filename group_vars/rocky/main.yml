---
# group_vars/rocky/main.yml
# vim: set tabstop=2 shiftwidth=2 expandtab:

# first include group_vars/all/main.yml

dib_block_device: "gpt"
dib_block_device_config: "{{ lookup('ansible.builtin.file', '../block-device-config/block-device-efi-config.yml') }}"
dib_openssh_server_hardening: "0"
dib_cloud_init_datasources: "None"
dib_bootloader_default_cmdline: "biosdevname=0 iommu=on net.ifnames=0 dm_mod.use_blk_mq=Y scsi_mod.use_blk_mq=Y"

# "rocky-cloud-image" is a local element in elements/, not one shipped by
# diskimage-builder. See elements/rocky-cloud-image/README.rst.
elements_base: "bootloader block-device-efi-lvm rocky-cloud-image dracut-regenerate"
elements_path: "../elements"
elements_custom: "custom-{{ target_group }}"

vm_memory_mb: "4096"
vm_cpus: "4"
# VMware exposes no Rocky-specific guest ID; use the closest supported one.
vm_os_type: "centos9_64Guest"

add_swap: true
swap_device: "/dev/mapper/vg1-lv_swap"
swap_size: "4096"

# vmware
vm_network: "VM Network"
vm_os_description: "Rocky Linux 10 (64-bit)"
vsphere_content_library: "Content_Library"

