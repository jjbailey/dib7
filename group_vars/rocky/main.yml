---
# group_vars/rocky/main.yml
# vim: set tabstop=2 shiftwidth=2 expandtab:

# first include group_vars/all/main.yml

# Only what differs per distro lives here. The block device, bootloader,
# element path, VM sizing and swap settings are shared and live in
# group_vars/all/main.yml; see doc/group-vars-distro.md.

# "rocky-cloud-image" is a local element in elements/, not one shipped by
# diskimage-builder. See elements/rocky-cloud-image/README.rst.
elements_base: "bootloader block-device-efi-lvm rocky-cloud-image dracut-regenerate"

# VMware exposes no Rocky-specific guest ID; use the closest supported one.
vm_os_type: "centos9_64Guest"

vm_os_description: "Rocky Linux 10 (64-bit)"

