---
# group_vars/all/main.yml
# vim: set tabstop=2 shiftwidth=2 expandtab:

# group_vars/<group>/main.yml can override these

# Every distro builds from the same virtualenv. The Fedora patch it carries only
# touches the fedora element, so it is inert for the other builds.
# See doc/python3-virtualenv.md.
venv_bin: "{{ ansible_env.HOME }}/.dib7/bin"
path: "{{ venv_bin }}:{{ ansible_env.PATH }}"
build_dir: "/work/dib-builds"

image_arch: "amd64"
image_name: "{{ inventory_hostname }}-base"
image_size: "35"
image_type: "qcow2"

# Cloud import behavior.
gcp_replace_existing_image: true
gcp_delete_qcow2_after_import: false

# Boot mode handed to AWS ImportImage. Every group currently builds with
# block-device-efi-config.yml, so uefi is right for all of them. Override in
# group_vars/<group>/main.yml if a build ever switches to the MBR config.
aws_import_boot_mode: "uefi"

mf_file: "{{ image_name }}.mf"
ova_file: "{{ image_name }}.ova"
ovf_file: "{{ image_name }}.ovf"
qcow2_file: "{{ image_name }}.qcow2"
vmdk_file: "{{ image_name }}.vmdk"

vsphere_template_name: "{{ inventory_hostname }}-base.tmpl"

dpkg_opts: "-o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold"
debian_frontend: "noninteractive"
needrestart_mode: "a"

