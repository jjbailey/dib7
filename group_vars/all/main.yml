---
# group_vars/all/main.yml
# vim: set tabstop=2 shiftwidth=2 expandtab:

# group_vars/<group>/main.yml can override these

# Every distro builds from the same virtualenv. The Fedora patch it carries only
# touches the fedora element, so it is inert for the other builds.
# See doc/python3-virtualenv.md.
venv_bin: "{{ ansible_env.HOME }}/.dib7/bin"
path: "{{ venv_bin }}:{{ ansible_env.PATH }}"
build_dir: "/work/dib-builds"
dib_vg_name: "vg1"

# Distro-independent DIB inputs. Every group builds with the same block device
# layout, kernel command line, element path, VM sizing and swap, so these live
# here; group_vars/<group>/main.yml holds only what actually differs per distro
# (elements_base, vm_os_type, vm_os_description). See doc/group-vars-distro.md.
dib_block_device: "gpt"
dib_block_device_config: "{{ lookup('ansible.builtin.file', '../block-device-config/block-device-efi-config.yml') }}"
dib_openssh_server_hardening: "0"
dib_cloud_init_datasources: "None"
dib_bootloader_default_cmdline: "biosdevname=0 iommu=on net.ifnames=0 dm_mod.use_blk_mq=Y scsi_mod.use_blk_mq=Y"

elements_path: "../elements"
elements_custom: "custom-{{ target_group }}"

vm_memory_mb: "4096"
vm_cpus: "4"

add_swap: true
swap_device: "/dev/mapper/{{ dib_vg_name }}-lv_swap"
swap_size: "4096"

# vmware
vm_network: "VM Network"

image_arch: "amd64"
image_name: "{{ inventory_hostname }}-base"
image_size: "35"
image_type: "qcow2"

# Terraform integration contract. The catalog lives in the repo rather than in
# build_dir so it survives a wipe of the build tree and can be committed.
# Override this path in a deployment-specific vars file or extra vars when the
# catalog is copied to release storage.
image_catalog_path: "{{ inventory_dir }}/catalogs/image-catalog.json"

# Safe site defaults; vaults/vsphere.yml may override these when configured.
vsphere_content_library: "Content_Library"
vsphere_template_name: "{{ inventory_hostname }}-base.tmpl"
# Optional placement constraints for vSphere template creation. An empty host
# keeps the existing automatic selection of any connected non-maintenance host.
vsphere_template_folder: "Templates"
vsphere_template_host: ""
# Prefer the run passed with -e run_id; fall back to the stamp
# verify-stamp.yml read off the artifact itself, which names the run that built
# it. The two are provably equal whenever both exist, because verify-stamp.yml
# fails the stage when they differ. A build started without run_id writes
# 'manual', which downstream stages preserve; pass one run_id throughout a
# release pipeline to obtain a version that identifies that build.
catalog_version: "{{ run_id | default(stage_source_run) | default('manual') }}"

# Cloud import behavior.
gcp_import_location: "us-central1"
gcp_replace_existing_image: true
gcp_delete_qcow2_after_import: false

# OVF metadata defaults. Override per distro when VMware's numeric guest ID
# differs; vm_os_type remains the authoritative VMware guest string.
ovf_os_id: "107"
ovf_os_version: "7"

# Boot mode of the built image. Every group currently builds with
# block-device-efi-config.yml, so uefi is right for all of them. Override in
# group_vars/<group>/main.yml if a build ever switches to the MBR config.
# This is a property of the image, not of any one provider, so every catalog
# entry records it from here rather than hardcoding uefi per import playbook.
image_boot_mode: "uefi"

# Boot mode handed to AWS ImportImage. Separate from image_boot_mode only
# because the AWS API takes it as an import parameter as well.
aws_import_boot_mode: "{{ image_boot_mode }}"

ova_file: "{{ image_name }}.ova"
ovf_file: "{{ image_name }}.ovf"
qcow2_file: "{{ image_name }}.qcow2"
vmdk_file: "{{ image_name }}.vmdk"

# Stage stamps. Each holds the run_id of the run that produced the artifact next
# to it, and the following stage refuses to consume an artifact whose stamp is
# missing or from an older run. Without them a stage that never executed leaves
# yesterday's qcow2/ova in place and the rest of the pipeline happily publishes
# it.
build_stamp_file: "{{ image_name }}.built"
convert_stamp_file: "{{ image_name }}.converted"

dpkg_opts: "-o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold"
debian_frontend: "noninteractive"
needrestart_mode: "a"

