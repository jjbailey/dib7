---
# group_vars/centos/main.yml
# vim: set tabstop=2 shiftwidth=2 expandtab:

# first include group_vars/all/main.yml

# Only what differs per distro lives here. The block device, bootloader,
# element path, VM sizing and swap settings are shared and live in
# group_vars/all/main.yml; see doc/group-vars-distro.md.
elements_base: "bootloader block-device-efi-lvm centos dracut-regenerate"

# Intentional, not a typo: same RHEL-family guest ID shared by the fedora and
# rocky groups (see doc/group-vars-distro.md), used as the closest available
# match for CentOS Stream 10 - the same kind of compatibility gap documented
# for Debian Trixie in group_vars/debian/main.yml.
vm_os_type: "centos9_64Guest"

vm_os_description: "CentOS 10 (64-bit)"

